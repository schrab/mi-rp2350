[env:rings-rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
; PIO-USB (host) bit-bangs USB on the CPU: clock MUST be a multiple of 12 MHz
; (250 MHz would break FS USB timing). 240 MHz = 12 * 20.
board_build.f_cpu = 240000000L
; No extra -Ds: the fork's rings has no engine-count registry (fixed members),
; no rate shim (kSampleRate 32000 is a compile-time constant we honor), and
; no STM32 flash paths inside dsp/ (the sync prune drops the firmware files).
build_flags =
    -O3
    -DUSE_TINYUSB
; Pico-PIO-USB is VENDORED in lib/pio_usb/ (v0.7.3, sekigon-gonnoc) instead of
; lib_deps: its library.properties depends=Adafruit TinyUSB Library would pull a
; duplicate project-level TinyUSB next to the core's force-linked bundled copy.
lib_ldf_mode = chain+
monitor_speed = 115200
