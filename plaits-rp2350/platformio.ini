[env:plaits-rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
; PIO-USB (host) bit-bangs USB on the CPU: clock MUST be a multiple of 12 MHz
; (250 MHz would break FS USB timing). 240 MHz = 12 * 20.
board_build.f_cpu = 240000000L
; -DPLAITS_ENGINE_COUNT=98: the whole Plaits-Lab catalog in one registry.
; build_config.h's 32-slot ceiling is raised by tools/patches/plaits/, and the
; speech/chiptune mask sites in voice.cc are widened to 64-bit (they shift
; 1u by slot index; slots >= 32 would be UB). Applies to src/ and lib/ alike
; (class Voice embeds EngineRegistry<PLAITS_ENGINE_COUNT> — the define must be
; identical in every TU).
; -DPLAITS_CORRECTED_SAMPLE_RATE=48000.0f: we clock I2S at true 48 kHz, so the
; fork's 47872.34 Hz module-clock pitch shim must compute to zero.
; -DPLAITS_HAS_USER_DATA_BANK=1: the three dx7-bank SixOpEngine slots load
; syx_bank_0/1/2 from resources.cc instead of STM32 flash (user_data.h is
; stubbed to the documented LoadUserData(NULL) path by patch).
build_flags =
    -O3
    -DUSE_TINYUSB
    -DPLAITS_ENGINE_COUNT=98
    -DPLAITS_CORRECTED_SAMPLE_RATE=48000.0f
    -DPLAITS_HAS_USER_DATA_BANK=1
; Pico-PIO-USB is VENDORED in lib/pio_usb/ (v0.7.3, sekigon-gonnoc) instead of
; lib_deps: its library.properties depends=Adafruit TinyUSB Library would pull a
; duplicate project-level TinyUSB next to the core's force-linked bundled copy.
lib_ldf_mode = chain+
monitor_speed = 115200
