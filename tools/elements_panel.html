<!DOCTYPE html>
<!--
  Elements RP2350 — web control panel (single file, no dependencies).

  Open in Chrome/Chromium/Edge (file:// works). Uses Web MIDI to talk to the
  synth (enumerates as "Pico 2 MIDI 1"). Defaults match the firmware's
  initEngine() patch seed; "Send panel" (also automatic on connect) pushes all
  CCs so the synth matches the panel.

  CC map = elements-rp2350/src/midi.h:
    14 CONTOUR  15 BOW    16 TIMBRE(bow)   17 BLOW  18 FLOW   19 TIMBRE(blow)
    20 STRIKE   21 MALLET 22 TIMBRE(strike) 23 GEOMETRY 24 BRIGHTNESS
    25 DAMPING  26 POSITION 27 SPACE
  COARSE / FINE are not CCs: COARSE transposes the notes the panel sends
  (-24..+24 st), FINE sends pitch bend (firmware range +-2 st, knob uses +-1 st).
  Omitted from the original panel per spec: FM knob, attenuverters, jacks.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elements — modal synthesizer panel</title>
<style>
  :root {
    --panel: #d8d7d4;
    --panel-edge: #c4c3bf;
    --ink: #3d3d3d;
    --red: #e6295e;
    --cyan: #17a3bd;
    --yellow: #f2d21f;
    --knob-s: 86px;
    --knob-b: 138px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #26272b;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
  }

  /* ---------- toolbar ---------- */
  #bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; background: #1d1e21; color: #cfcfcf;
    font-size: 13px; border-bottom: 1px solid #101114;
  }
  #bar button, #bar select {
    background: #33343a; color: #e4e4e4; border: 1px solid #4a4b52;
    border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer;
  }
  #bar button:hover { background: #3f4047; }
  #bar select { cursor: default; }
  #bar label { display: flex; align-items: center; gap: 5px; color: #9a9a9f; }
  #dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #55565e; box-shadow: 0 0 0 2px #2a2b30 inset;
  }
  #dot.ok { background: #3ecf6a; box-shadow: 0 0 8px #3ecf6a88; }
  #dot.err { background: #e05252; }
  #status { color: #9a9a9f; }

  #wrap { width: 1220px; max-width: 98vw; margin: 22px auto 40px; }

  /* ---------- panel ---------- */
  #panel {
    position: relative;
    background: linear-gradient(#dcdcda, #d4d3d0);
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    box-shadow: 0 18px 45px rgba(0,0,0,.5);
    padding: 52px 44px 48px;
  }
  .screw {
    position: absolute; width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e4e4e1, #a8a8a4 70%, #8e8e8a);
    box-shadow: inset 0 1px 2px rgba(0,0,0,.35), 0 1px 1px rgba(255,255,255,.5);
  }
  .screw::before, .screw::after {
    content: ""; position: absolute; background: #85858a; border-radius: 1px;
  }
  .screw::before { left: 50%; top: 2px; bottom: 2px; width: 2px; margin-left: -1px; transform: rotate(45deg); }
  .screw::after  { top: 50%; left: 2px; right: 2px; height: 2px; margin-top: -1px; transform: rotate(45deg); }
  .screw.tl { top: 12px; left: 12px; }   .screw.tr { top: 12px; right: 12px; }
  .screw.bl { bottom: 12px; left: 12px; }.screw.br { bottom: 12px; right: 12px; }

  #ptitle {
    position: absolute; top: 16px; right: 46px;
    font-size: 23px; font-weight: 300; color: #55565a; letter-spacing: .5px;
  }

  #sections {
    display: grid;
    grid-template-columns: 1fr 26px 1fr;
    align-items: stretch;
  }
  section { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 30px; }
  #right { grid-template-columns: repeat(3, 1fr); }
  #divider {
    border-left: 2px dotted #b3b2ad;
    margin: 12px auto; height: 92%;
  }

  .cell { display: flex; flex-direction: column; align-items: center; gap: 9px; }

  .label { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; color: var(--ink); }
  .pill {
    color: #fff; padding: 2px 12px; border-radius: 3px;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .pill.red { background: var(--red); }
  .pill.cyan { background: var(--cyan); }
  .cctag { font-size: 9px; letter-spacing: .5px; color: #9b9a95; margin-top: -4px; }

  /* ---------- knobs ---------- */
  .knob { position: relative; cursor: ns-resize; touch-action: none; outline: none; }
  .knob.small { width: var(--knob-s); height: var(--knob-s); }
  .knob.big   { width: var(--knob-b); height: var(--knob-b); }
  .knob:focus-visible { border-radius: 50%; box-shadow: 0 0 0 3px #f2d21f66; }
  /* ring + cap stay put (fixed lighting); .rot carries only the pointer notch and spins */
  .rot { position: absolute; inset: 0; transform: rotate(var(--deg, 0deg)); }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,255,255,.14), rgba(0,0,0,0) 55%),
      repeating-conic-gradient(#303034 0deg 3.6deg, #131316 3.6deg 7.2deg);
    box-shadow:
      0 7px 14px rgba(0,0,0,.38),
      inset 0 2px 3px rgba(255,255,255,.16),
      inset 0 -3px 6px rgba(0,0,0,.5);
  }
  .cap {
    position: absolute; border-radius: 50%;
    box-shadow: 0 3px 6px rgba(0,0,0,.45), inset 0 -4px 8px rgba(0,0,0,.18), inset 0 2px 3px rgba(255,255,255,.65);
  }
  .knob.small .cap { inset: 21%; }
  .knob.big   .cap { inset: 18%; }
  .cap.white { background: radial-gradient(circle at 36% 30%, #ffffff, #ececea 55%, #dbdbd8); }
  .cap.red   { background: radial-gradient(circle at 36% 30%, #ff5d87, #e6295e 55%, #bd1c4b); }
  .cap.cyan  { background: radial-gradient(circle at 36% 30%, #43c6dc, #17a3bd 55%, #0e7f96); }
  .notch {
    position: absolute; top: 5.5%; left: 50%; width: 11%; height: 15%;
    margin-left: -5.5%; border-radius: 3px;
    box-shadow: 0 1px 1px rgba(0,0,0,.35);
  }
  .notch.white { background: #f2f2f0; border: 1px solid rgba(0,0,0,.14); }
  .notch.red   { background: #ffb3c8; }
  .notch.cyan  { background: #9fe3ef; }

  /* ---------- play button ---------- */
  #play {
    width: 66px; height: 66px; border-radius: 50%;
    border: 0; cursor: pointer; padding: 0; position: relative;
    background:
      radial-gradient(circle at 50% 42%, rgba(255,255,255,.12), rgba(0,0,0,0) 55%),
      repeating-conic-gradient(#303034 0deg 5deg, #131316 5deg 10deg);
    box-shadow: 0 7px 14px rgba(0,0,0,.38), inset 0 2px 3px rgba(255,255,255,.16);
    outline: none;
  }
  #play span {
    position: absolute; inset: 16%; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #ffe95c, #f2d21f 55%, #d3b30d);
    box-shadow: 0 3px 6px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.18), inset 0 2px 3px rgba(255,255,255,.6);
  }
  #play.held span { background: radial-gradient(circle at 36% 30%, #fff29e, #ffe14a 55%, #e8c611); }
  #play:active { transform: scale(.97); }

  /* ---------- transport bar ---------- */
  #kbbar {
    display: flex; align-items: center; gap: 14px;
    margin-top: 18px; padding: 9px 14px;
    background: #1d1e21; color: #cfcfcf; font-size: 13px;
    border: 1px solid #101114; border-radius: 6px;
  }
  #kbbar button {
    background: #33343a; color: #e4e4e4; border: 1px solid #4a4b52;
    border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  #octName { min-width: 34px; text-align: center; color: #f2d21f; font-weight: 700; }
  #kbbar label { display: flex; align-items: center; gap: 7px; color: #9a9a9f; }
  #help { margin-left: auto; color: #7d7e85; font-size: 12px; }

  /* ---------- tooltip ---------- */
  #tooltip {
    position: fixed; display: none; z-index: 10; pointer-events: none;
    background: #1d1e21; color: #f2f2f2; font-size: 12px; font-weight: 700;
    padding: 3px 9px; border-radius: 4px; border: 1px solid #4a4b52;
    transform: translate(-50%, -130%);
  }
</style>
</head>
<body>

<div id="bar">
  <button id="connect">Connect MIDI</button>
  <select id="ports" title="MIDI output port"></select>
  <label>Ch <select id="chan"></select></label>
  <button id="sync" title="Send all panel CCs to the synth">Send panel</button>
  <button id="panic" title="All notes off">Panic</button>
  <span id="dot"></span><span id="status">not connected</span>
</div>

<div id="wrap">
  <div id="panel">
    <div class="screw tl"></div><div class="screw tr"></div>
    <div class="screw bl"></div><div class="screw br"></div>
    <div id="ptitle">modal synthesizer</div>
    <div id="sections">
      <section id="left">
        <div class="cell" style="grid-column:1;grid-row:2">
          <button id="play" aria-label="Play"><span></span></button>
          <div class="label">PLAY</div>
        </div>
      </section>
      <div id="divider"></div>
      <section id="right"></section>
    </div>
  </div>

  <div id="kbbar">
    <button id="octDown">Oct&minus;</button>
    <span id="octName">C3</span>
    <button id="octUp">Oct+</button>
    <label>VEL <input id="vel" type="range" min="1" max="127" value="100"></label>
    <span id="help">Z S X D C V G B H N J M , &mdash; lower &nbsp;&middot;&nbsp; Q 2 W 3 E R 5 T 6 Y 7 U &mdash; upper &nbsp;&middot;&nbsp; &uarr;/&darr; octave &nbsp;&middot;&nbsp; Space = PLAY &nbsp;&middot;&nbsp; Shift-drag = fine</span>
  </div>
</div>

<div id="tooltip"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ================= knob definitions (CC map from src/midi.h) ================= */
const KNOBS = [
  // left — exciters
  { id:'contour',  cc:14, label:'CONTOUR', variant:'white', def:13/127, sec:'left', col:'1', row:1 },
  { id:'bow',      cc:15, label:'BOW',     variant:'white', def:0,      sec:'left', col:'2', row:1 },
  { id:'blow',     cc:17, label:'BLOW',    variant:'red',   pill:'red', def:0,      sec:'left', col:'3', row:1 },
  { id:'strike',   cc:20, label:'STRIKE',  variant:'cyan',  pill:'cyan',def:102/127,sec:'left', col:'4', row:1 },
  { id:'flow',     cc:18, label:'FLOW',    variant:'red',   pill:'red', big:1, def:64/127, sec:'left', col:'2 / span 2', row:2 },
  { id:'mallet',   cc:21, label:'MALLET',  variant:'cyan',  pill:'cyan',big:1, def:64/127, sec:'left', col:'4', row:2 },
  { id:'timbreB',  cc:16, label:'TIMBRE',  variant:'white', def:.5,     sec:'left', col:'2', row:3 },
  { id:'timbreBl', cc:19, label:'TIMBRE',  variant:'red',   pill:'red', def:.5,     sec:'left', col:'3', row:3 },
  { id:'timbreS',  cc:22, label:'TIMBRE',  variant:'cyan',  pill:'cyan',def:.5,     sec:'left', col:'4', row:3 },
  // right — resonator (FM knob omitted per spec)
  { id:'coarse',   type:'coarse', label:'COARSE', variant:'white', def:.5, tag:'transpose', sec:'right', col:'1', row:1 },
  { id:'fine',     type:'fine',   label:'FINE',   variant:'white', def:.5, tag:'pitch bend', sec:'right', col:'2', row:1 },
  { id:'geometry',   cc:23, label:'GEOMETRY',   variant:'white', big:1, def:.25, sec:'right', col:'1', row:2 },
  { id:'brightness', cc:24, label:'BRIGHTNESS', variant:'white', big:1, def:.4,  sec:'right', col:'2 / span 2', row:2 },
  { id:'damping',  cc:25, label:'DAMPING',  variant:'white', def:.7, sec:'right', col:'1', row:3 },
  { id:'position', cc:26, label:'POSITION', variant:'white', def:.3, sec:'right', col:'2', row:3 },
  { id:'space',    cc:27, label:'SPACE',    variant:'white', def:.4, sec:'right', col:'3', row:3 },
  { id:'mode',     cc:28, label:'MODE',     variant:'white', type:'mode', def:.5, sec:'right', col:'3', row:1 },
  { id:'egg',      cc:29, label:'OMINOUS',  variant:'white', type:'egg',  def:0,  sec:'right', col:'2', row:4 },
];
const controls = new Map();

/* ================= MIDI ================= */
let access = null, out = null, ch = 0;
const voices = new Map();          // voiceId -> sent midi note
let coarseSemi = 0, fineSt = 0, lastNote = 48;
let bendDirty = false, flushQueued = false;
const ccDirty = new Map();

function send(...b) { if (out) { try { out.send(b); } catch (e) {} } }
const sendCC = (cc, v) => send(0xB0 | ch, cc, v & 127);
const bend14 = () => clamp(Math.round(8192 + fineSt * 4096), 0, 16383);
function sendBend() { const b = bend14(); send(0xE0 | ch, b & 127, (b >> 7) & 127); }
// CC value: MODE is a 3-way selector (0/1/2), OMINOUS a 2-way switch (0/1),
// everything else is 0..127.
const ccVal = c => c.type === 'mode' ? Math.round(c.v * 2)
              : c.type === 'egg'  ? Math.round(c.v)
              : Math.round(c.v * 127);

function queueSend(c) {
  if (c.cc !== undefined) ccDirty.set(c.id, c);
  if (c.type === 'fine') bendDirty = true;
  if (!flushQueued) { flushQueued = true; setTimeout(flush, 5); }  // timer, not rAF: must fire in background tabs
}
function flush() {
  flushQueued = false;
  for (const c of ccDirty.values()) sendCC(c.cc, ccVal(c));
  ccDirty.clear();
  if (bendDirty) { bendDirty = false; sendBend(); }
}

function noteOn(id, note, vel) {
  const n = clamp(note + coarseSemi, 0, 127);
  voices.set(id, n);
  send(0x90 | ch, n, vel);
  lastNote = note;
}
function noteOff(id) {
  const n = voices.get(id);
  if (n === undefined) return;
  voices.delete(id);
  if (![...voices.values()].includes(n)) send(0x80 | ch, n, 64);
}
const getVel = () => +$('#vel').value;

function sendSync() {
  for (const c of controls.values()) if (c.cc !== undefined) sendCC(c.cc, ccVal(c));
  sendBend();
}
function panic() {
  for (let c = 0; c < 16; c++) send(0xB0 | c, 123, 0);   // firmware ignores channel nibble
  voices.clear(); refreshHighlight();
}

function setStatus(text, cls) { $('#status').textContent = text; $('#dot').className = cls || ''; }

function refreshPorts() {
  const sel = $('#ports');
  const prev = sel.value;
  sel.innerHTML = '';
  const outs = access ? [...access.outputs.values()] : [];
  for (const p of outs) {
    const o = document.createElement('option');
    o.value = p.id; o.textContent = p.name;
    sel.appendChild(o);
  }
  if (!outs.length) { out = null; setStatus('no MIDI outputs', 'err'); return; }
  const prevStill = outs.some(p => p.id === prev);
  const auto = outs.find(p => /pico|elements/i.test(p.name));
  sel.value = prevStill ? prev : (auto ? auto.id : outs[0].id);
  const changed = !out || out.id !== sel.value;
  out = access.outputs.get(sel.value);
  if (changed) { sendSync(); setStatus(`\u2192 ${out.name} (ch ${ch + 1})`, 'ok'); }
}

async function connectMidi() {
  if (!navigator.requestMIDIAccess) {
    setStatus('Web MIDI unsupported \u2014 use Chrome/Chromium/Edge', 'err');
    return;
  }
  try { access = await navigator.requestMIDIAccess({ sysex: false }); }
  catch (e) { setStatus('MIDI access denied (' + e.name + ')', 'err'); return; }
  access.onstatechange = refreshPorts;
  refreshPorts();
}

/* ================= knob widget ================= */
const tooltip = $('#tooltip');
let tipTimer = 0;

function showTip(c) {
  const r = c.el.getBoundingClientRect();
  tooltip.textContent = displayValue(c);
  tooltip.style.left = (r.left + r.width / 2) + 'px';
  tooltip.style.top = r.top + 'px';
  tooltip.style.display = 'block';
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => tooltip.style.display = 'none', 900);
}
function displayValue(c) {
  if (c.type === 'mode') return ['MODAL','STRING','STRINGS'][Math.round(c.v * 2)];
  if (c.type === 'egg')  return Math.round(c.v) ? 'OMINOUS' : 'NORMAL';
  if (c.type === 'coarse') { const s = coarseOf(c); return (s >= 0 ? '+' : '') + s + ' st'; }
  if (c.type === 'fine')   { const t = Math.round(fineOf(c) * 100); return (t >= 0 ? '+' : '') + t + ' \u00A2'; }
  return String(Math.round(c.v * 127));
}
const coarseOf = c => Math.round(c.v * 48 - 24);
const fineOf   = c => c.v * 2 - 1;

function setControl(c, v, show, queue = true) {
  if (c.type === 'mode') v = [0, 0.5, 1][Math.round(v * 2)];   // snap: MODAL / STRING / STRINGS
  if (c.type === 'egg')  v = Math.round(v);                    // snap: NORMAL / OMINOUS
  c.v = clamp(v, 0, 1);
  c.el.style.setProperty('--deg', (-135 + c.v * 270) + 'deg');
  c.el.setAttribute('aria-valuenow',
    c.type === 'coarse' ? coarseOf(c) : c.type === 'fine' ? Math.round(fineOf(c) * 100) : c.type === 'mode' ? Math.round(c.v * 2) : c.type === 'egg' ? Math.round(c.v) : Math.round(c.v * 127));
  if (c.type === 'coarse') coarseSemi = coarseOf(c);
  if (c.type === 'fine')   fineSt = fineOf(c);
  if (queue) queueSend(c);
  if (show) showTip(c);
}

function makeKnob(c) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.style.gridColumn = c.col;
  cell.style.gridRow = c.row;

  const el = document.createElement('div');
  el.className = 'knob ' + (c.big ? 'big' : 'small');
  el.tabIndex = 0;
  el.setAttribute('role', 'slider');
  el.setAttribute('aria-label', c.label);
  el.setAttribute('aria-valuemin', c.type === 'coarse' ? -24 : c.type === 'fine' ? -100 : 0);
  el.setAttribute('aria-valuemax', c.type === 'coarse' ? 24 : c.type === 'fine' ? 100 : 127);
  el.innerHTML = `<div class="ring"></div><div class="cap ${c.variant}"></div>` +
                 `<div class="rot"><div class="notch ${c.variant}"></div></div>`;
  cell.appendChild(el);

  const lab = document.createElement('div');
  lab.className = 'label' + (c.pill ? ' pill ' + c.pill : '');
  lab.textContent = c.label;
  cell.appendChild(lab);

  const tag = document.createElement('div');
  tag.className = 'cctag';
  tag.textContent = c.cc !== undefined ? 'CC ' + c.cc : c.tag;
  cell.appendChild(tag);

  $(c.sec === 'left' ? '#left' : '#right').appendChild(cell);

  c.el = el;
  c.v = c.def;
  controls.set(c.id, c);
  setControl(c, c.def, false, false);

  let startY = 0, startV = 0, dragging = false;
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    dragging = true; startY = e.clientY; startV = c.v;
    showTip(c);
  });
  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    // OMINOUS is 2-state: full travel in 100px so flipping back is quick
    const px = c.type === 'egg' ? 100 : e.shiftKey ? 800 : 200;
    setControl(c, startV + (startY - e.clientY) / px, true);
  });
  const end = () => dragging = false;
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('dblclick', () => setControl(c, c.def, true));
  // snapped selectors step one POSITION per notch/key — a 1/127 step never
  // crosses the round() boundary, so the knob would feel stuck at OMINOUS
  const stepOf = (dir, fine) =>
    c.type === 'mode' ? 0.5 * dir : c.type === 'egg' ? dir : fine * dir;
  el.addEventListener('wheel', e => {
    e.preventDefault();
    setControl(c, c.v + stepOf(e.deltaY < 0 ? 1 : -1,
                               e.shiftKey ? 1 / 1270 : 1 / 127), true);
  }, { passive: false });
  el.addEventListener('keydown', e => {
    const fine = e.shiftKey ? 1 / 1270 : 1 / 127;
    let d = 0;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') d = stepOf(1, fine);
    if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') d = stepOf(-1, fine);
    if (d) { e.preventDefault(); setControl(c, c.v + d, true); }
  });
}

for (const c of KNOBS) makeKnob(c);

/* play button — momentary gate at the last played note */
const play = $('#play');
const playOn  = () => { if (!voices.has('play')) { play.classList.add('held'); noteOn('play', lastNote, getVel()); } };
const playOff = () => { if (voices.has('play')) { play.classList.remove('held'); noteOff('play'); } };
play.addEventListener('pointerdown', e => { e.preventDefault(); play.setPointerCapture(e.pointerId); playOn(); });
play.addEventListener('pointerup', playOff);
play.addEventListener('pointercancel', playOff);

/* ================= keyboard ================= */
const KEYMAP = {
  z:0, s:1, x:2, d:3, c:4, v:5, g:6, b:7, h:8, n:9, j:10, m:11,
  ',':12, l:13, '.':14, ';':15, '/':16,
  q:12, '2':13, w:14, '3':15, e:16, r:17, '5':18, t:19, '6':20,
  y:21, '7':22, u:23, i:24, '9':25, o:26, '0':27, p:28,
};
let oct = 3;                       // Z key = C3 = MIDI 48 (firmware default)
const baseNote = () => 12 * (oct + 1);
const setOct = d => { oct = clamp(oct + d, 0, 7); $('#octName').textContent = 'C' + oct; };
$('#octDown').addEventListener('click', () => setOct(-1));
$('#octUp').addEventListener('click', () => setOct(1));

/* computer keyboard */
window.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t instanceof HTMLSelectElement || t instanceof HTMLInputElement) return;
  if (e.key === 'ArrowUp') { e.preventDefault(); setOct(1); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); setOct(-1); return; }
  if (e.key === ' ') { e.preventDefault(); playOn(); return; }
  const k = e.key.toLowerCase();
  if (k in KEYMAP) { e.preventDefault(); if (!voices.has('k:' + k)) noteOn('k:' + k, baseNote() + KEYMAP[k], getVel()); }
});
window.addEventListener('keyup', e => {
  if (e.key === ' ') { playOff(); return; }
  const k = e.key.toLowerCase();
  if (k in KEYMAP) noteOff('k:' + k);
});
window.addEventListener('blur', () => {
  for (const id of [...voices.keys()]) if (id.startsWith('k:') || id.startsWith('p:')) noteOff(id);
  playOff();
});

/* ================= toolbar wiring ================= */
$('#connect').addEventListener('click', connectMidi);
$('#sync').addEventListener('click', () => { sendSync(); setStatus(out ? `\u2192 ${out.name} (ch ${ch + 1})` : 'not connected', out ? 'ok' : ''); });
$('#panic').addEventListener('click', panic);
$('#ports').addEventListener('change', () => { out = access ? access.outputs.get($('#ports').value) : null; sendSync(); if (out) setStatus(`\u2192 ${out.name} (ch ${ch + 1})`, 'ok'); });
const chanSel = $('#chan');
for (let i = 1; i <= 16; i++) {
  const o = document.createElement('option');
  o.value = i - 1; o.textContent = i;
  chanSel.appendChild(o);
}
chanSel.addEventListener('change', () => { ch = +chanSel.value; if (out) setStatus(`\u2192 ${out.name} (ch ${ch + 1})`, 'ok'); });

/* try to grab MIDI access right away (Chrome shows its permission prompt) */
connectMidi();
</script>
