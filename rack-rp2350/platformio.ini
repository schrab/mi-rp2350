; Rack RP2350 — all four accepted module ports (Elements, Clouds, Plaits
; 98-engine, Rings MiniElements) in ONE firmware. T1: the boot module is
; selected at COMPILE time via RACK_BOOT_MODULE (0 elements / 1 clouds /
; 2 plaits / 3 rings); T2 replaces it with a runtime swap. ALL FOUR modules'
; code is linked in every env: the SELECTED module's .tc_* hot sections get
; the SRAM window, the other three stay flash-resident (.tc_flash_* dead
; weight in the reserved flash region, see memmap_rack_<module>.ld); only
; the SELECTED module instantiates state (compile-guarded in src/module_*.h).
;
; Each env links its own per-env linker script (board_build.ldscript below):
; the SRAM window is sized for THIS env's module only — the old shared
; memmap_rack.ld forced plaits' 268 KiB window onto every env and starved
; the others' heap (clouds could not even malloc core 1's separate 8 KB
; stack, so core 1 never launched). See each script's header for the sizing
; math and ASSERTs.
;
; RACK_RP2350_TC switches every module's RAM_CODE macro prefix from
; .time_critical. to .tc_<module>. (see lib patches +
; memmap_rack_<module>.ld) — it must be defined in ALL four envs because all
; four libs compile in every env. The plaits defines mirror
; plaits-rp2350/platformio.ini (src/ and lib/ alike).
[platformio]
default_envs = rack-elements, rack-clouds, rack-plaits, rack-rings

[common]
build_flags =
    -O3
    -DUSE_TINYUSB
    -DRACK_RP2350_TC
    -DPLAITS_ENGINE_COUNT=98
    -DPLAITS_CORRECTED_SAMPLE_RATE=48000.0f
    -DPLAITS_HAS_USER_DATA_BANK=1

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
; PIO-USB (host) bit-bangs USB on the CPU: clock MUST be a multiple of 12 MHz
; (250 MHz would break FS USB timing). 240 MHz = 12 * 20.
board_build.f_cpu = 240000000L
; Rack linker fork: module hot sections flash-resident + NOLOAD SRAM window.
; The script is set PER ENV below (memmap_rack_<module>.ld) — per-env window
; sizing; see each script's header for the sizing math and ASSERTs.
; Pico-PIO-USB is VENDORED in lib/pio_usb/ (v0.7.3, sekigon-gonnoc) instead of
; lib_deps: its library.properties depends=Adafruit TinyUSB Library would pull a
; duplicate project-level TinyUSB next to the core's force-linked bundled copy.
lib_ldf_mode = chain+
monitor_speed = 115200

[env:rack-elements]
build_flags = ${common.build_flags} -DRACK_BOOT_MODULE=0
board_build.ldscript = memmap_rack_elements.ld

[env:rack-clouds]
build_flags = ${common.build_flags} -DRACK_BOOT_MODULE=1
board_build.ldscript = memmap_rack_clouds.ld

[env:rack-plaits]
build_flags = ${common.build_flags} -DRACK_BOOT_MODULE=2
board_build.ldscript = memmap_rack_plaits.ld

[env:rack-rings]
build_flags = ${common.build_flags} -DRACK_BOOT_MODULE=3
board_build.ldscript = memmap_rack_rings.ld
