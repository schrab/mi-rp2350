; Rack RP2350 — ONE unified firmware: all five modules (Elements, Clouds,
; Plaits 98-engine, Rings MiniElements, LIRA-8) compile into every build.
; T2: module adapters are arena-placed (src/rack_arena.h), their .tc_* hot
; sections share ONE SRAM window via the tc_* OVERLAY in the ONE linker
; script memmap_rack.ld (same VMA, sequential LMAs in RACK_LMA).
;
; RACK_BOOT_MODULE picks which module boots (window copy + registry Init in
; setup()). Runtime swaps (MIDI CC 32 / serial console) re-use the same copy
; path on core 1. There is exactly ONE env: the old five per-module envs
; were a testing-phase artifact — the board boots LIRA-8 and everything else
; is reachable live. New modules continue the ids (5, 6, ...) — add the
; adapter to src/, extend the registry/window tables, bump the id here.
;
; RACK_RP2350_TC switches every module's RAM_CODE macro prefix from
; .time_critical. to .tc_<module>. (see memmap_rack.ld) — every lib compiles
; in the one env.
[platformio]
default_envs = rack

[env:rack]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
; -DRACK_PLAITS_RUNTIME_RATE (T6 chain mode): plaits' kSampleRate is a
; runtime global so a chained plaits slot renders at the 32 kHz chain grid
; while switched plaits stays at its native 48 kHz.
build_flags =
    -O3
    -I../PicoCollider/include
    -I../PicoCollider/include/picocollider
    -DUSE_TINYUSB
    -DRACK_RP2350_TC
    ; Persistent switchable hang diagnostics (never delete — see main.cpp).
    ; 1 = core-0/core-1 watchdog scratch breadcrumbs + CRUMB boot print.
    ; 0 for production (current); code stays compiled either way. Was set 1
    ; to localize the 2026-11-17 Warps-at-320MHz hang -> core voltage.
    -DRACK_HANG_DEBUG=0
    -DPLAITS_ENGINE_COUNT=98
    -DPLAITS_CORRECTED_SAMPLE_RATE=48000.0f
    -DPLAITS_HAS_USER_DATA_BANK=1
    -DRACK_PLAITS_RUNTIME_RATE
    -DRACK_ENABLE_USB_HOST=0
    ; Boot module: 0 elements / 1 clouds / 2 plaits / 3 rings / 4 lira8 /
    ; 5 dronecaster / 6 benjolin.
    ; 6 = Benjolin (the current testing focus; switch at runtime via CC 32).
    -DRACK_BOOT_MODULE=6
; 320 MHz overclock (T9 sweep 2026-11-17): hardware bench found 270 MHz at
; the default VREG 1.15 V resets in soak (reason 3) even with flash SCK 67.5
; — the lever is CORE VOLTAGE, not flash timing. At VREG 1.20 V, 270/280/288/
; 300/312/320 all soaked clean (FNV OK, 0 stalls); 328 was the outer edge,
; 336 the cliff (immediate reset at 1.20 V, hard CDC-wedged hang at 1.25 V).
; The pre-clock constructor in main.cpp raises VREG 1.20 and pins QMI CLKDIV 4
; / RXDELAY 3 (SCK 80 MHz at 320) BEFORE the core applies F_CPU. Readback:
; `qmi`, `vreg`. NOTE: 320 is not a 12 MHz multiple — PIO-USB host (currently
; disabled, RACK_ENABLE_USB_HOST=0) would need 312 or 264 instead.
; Recovery: hold BOOTSEL + replug, reflash.
board_build.f_cpu = 320000000L
; Rack linker fork (T2 unified): the modules' hot sections are ONE
; flash-resident OVERLAY (VMA = the shared 112 KiB SRAM window at the top of
; main SRAM, LMAs sequential in the reserved RACK_LMA flash region); any
; module's image is memcpy'd into the window at boot (RACK_BOOT_MODULE) or
; at a live swap. See memmap_rack.ld's header for the sizing math and ASSERTs.
board_build.ldscript = memmap_rack.ld
; Pico-PIO-USB is VENDORED in lib/pio_usb/ (v0.7.3, sekigon-gonnoc) instead of
; lib_deps: its library.properties depends=Adafruit TinyUSB Library would pull a
; duplicate project-level TinyUSB next to the core's force-linked bundled copy.
lib_ldf_mode = chain+
lib_ignore = pio_usb
monitor_speed = 115200
