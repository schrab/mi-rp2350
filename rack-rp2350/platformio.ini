; Rack RP2350 — all four accepted module ports (Elements, Clouds, Plaits
; 98-engine, Rings MiniElements) in ONE firmware with LIVE MODULE SWITCHING.
; T2: every env builds the SAME unified binary — all four module adapters
; compile (state is arena-placed in src/rack_arena.h arenas), all four
; .tc_* hot sections share ONE SRAM window via the tc_* OVERLAY in the ONE
; linker script memmap_rack.ld (same VMA, sequential LMAs in RACK_LMA).
; The envs differ ONLY in RACK_BOOT_MODULE (0 elements / 1 clouds /
; 2 plaits / 3 rings): which module boots (window copy + registry Init in
; setup()). Runtime swaps (MIDI CC 32 / serial console) re-use the same copy
; path on core 1.
;
; RACK_RP2350_TC switches every module's RAM_CODE macro prefix from
; .time_critical. to .tc_<module>. (see lib patches + memmap_rack.ld) — it
; must be defined in ALL four envs because all four libs compile in every
; env. The plaits defines mirror plaits-rp2350/platformio.ini (src/ and
; lib/ alike).
[platformio]
default_envs = rack-elements, rack-clouds, rack-plaits, rack-rings

[common]
; -DRACK_PLAITS_RUNTIME_RATE (T6 chain mode): plaits' kSampleRate becomes a
; runtime global via tools/patches/plaits/08-plaits-runtime-rate.patch so a
; chained plaits slot renders at the 32 kHz chain grid while switched plaits
; stays at its native 48 kHz. The standalone ports do NOT define this — their
; kSampleRate stays the compile-time 48 kHz constant.
build_flags =
    -O3
    -DUSE_TINYUSB
    -DRACK_RP2350_TC
    -DPLAITS_ENGINE_COUNT=98
    -DPLAITS_CORRECTED_SAMPLE_RATE=48000.0f
    -DPLAITS_HAS_USER_DATA_BANK=1
    -DRACK_PLAITS_RUNTIME_RATE
    -DRACK_ENABLE_USB_HOST=0

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
; PIO-USB (host) bit-bangs USB on the CPU: clock MUST be a multiple of 12 MHz
; (250 MHz would break FS USB timing). 240 MHz = 12 * 20.
board_build.f_cpu = 240000000L
; Rack linker fork (T2 unified): the four modules' hot sections are ONE
; flash-resident OVERLAY (VMA = the shared 112 KiB SRAM window at the top of
; main SRAM, LMAs sequential in the reserved RACK_LMA flash region); any
; module's image is memcpy'd into the window at boot (RACK_BOOT_MODULE) or
; at a live swap. See memmap_rack.ld's header for the sizing math and ASSERTs.
board_build.ldscript = memmap_rack.ld
; Pico-PIO-USB is VENDORED in lib/pio_usb/ (v0.7.3, sekigon-gonnoc) instead of
; lib_deps: its library.properties depends=Adafruit TinyUSB Library would pull a
; duplicate project-level TinyUSB next to the core's force-linked bundled copy.
lib_ldf_mode = chain+
lib_ignore = pio_usb
monitor_speed = 115200

[env:rack-elements]
build_flags = ${common.build_flags} -DRACK_BOOT_MODULE=0

[env:rack-clouds]
build_flags = ${common.build_flags} -DRACK_BOOT_MODULE=1

[env:rack-plaits]
build_flags = ${common.build_flags} -DRACK_BOOT_MODULE=2

[env:rack-rings]
build_flags = ${common.build_flags} -DRACK_BOOT_MODULE=3
